<!DOCTYPE html>
<html lang="en">
<head>	
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Involved - Charity & Fundraising</title>
   <link rel="stylesheet" href="style.css">
   		<link href="mobile.css" rel="stylesheet" type="text/css" />
<link href="desktop.css" rel="stylesheet" type="text/css" />
<style>

body {
  font-family: 'Arial', sans-serif;
  background-color: #33CEFF;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  margin: 5;
}

form {
  background-color: #fff;
  padding: 30px;
  border-radius: 8px;
  box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
  width: 400px;
}

		
label {
  display: block;
  margin-bottom: 6px;
  font-weight: bold;
}

input[type="text"],
input[type="number"],
select {
  width: calc(100% - 22px);
  padding: 10px;
  margin-bottom: 15px;
  border: 1px solid #ddd;
  border-radius: 4px;
  box-sizing: border-box;
}
input[type="checkbox"] {
  margin-right: 5px;
}

input[type="submit"] {
  background-color: #007bff;
  color: white;
  padding: 12px 20px;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  transition: background-color 0.3s ease;
}

input[type="submit"]:hover {
  background-color: #0069d9;
}

.error {
  color: #dc3545;
  font-size: 14px;
  margin-top: 5px;
}


</style>
</head>
<body>


<form id="registrationForm">
  <div class="involvement-option">
  <p><h1>Partner Registration          </h1></p>
 </div>
  <label for="fullName">Full Name:</label>
  <input type="text" id="fullName" required>

  <label for="icNumber">IC Number:</label>
  <input type="text" id="icNumber" required>
  <span id="icError" class="error"></span>

  <label for="age">Age:</label>
  <input type="number" id="age" required>
  <span id="ageError" class="error"></span>

  <label for="gender">Gender:</label>
  <input type="text" id="gender" readonly>

  <label for="course">Partner type:</label>
  <select id="course" required>
    <option value="Daily usage collection">Daily usage sponsor</option>
    <option value="Food collection">Food sponsor</option>
    <option value="Clothes collection">Clothes sponsor</option>
    <option value="Money collection">Money sponsor</option>
  </select>

  <label for="terms">Terms and Conditions:</label>
  <input type="checkbox" id="terms" required>

  <input type="submit" value="Submit">
  
  <h5>prepared by</h5>
      <h5><p>KIRSYANTHIRAN, GANESHA, NAVINESH</p></h5>
</form>

<script>

function validateIC(icNumber) {
  const icError = document.getElementById("icError");
  icError.textContent = ""; // Clear previous error messages

  if (!/^\d{12}$/.test(icNumber)) {
    icError.textContent = "IC Number must be exactly 12 digits.";
    return { isValid: false, gender: null };
  }

  const lastDigit = parseInt(icNumber.slice(-1));
  const gender = lastDigit % 2 === 1 ? "Male" : "Female";
  return { isValid: true, gender: gender };
}

function generateGreeting(name, gender) {
  const salutation = gender === "Male" ? "Mr." : "Ms.";
  return `Welcome, ${salutation} ${name}!`;
}

function getCourseMessage(course) {
  switch (course) {
    case "Daily usage collection":
      return "Get ready to collect Daily usage for donation!";
    case "Food collection":
      return "Get ready to collect Food for donation!";
    case "Clothes collection":
      return "Get ready to collect Clothes for donation!";
    case "Money collection":
      return "Get ready to collect Money for donation!";
    default:
      return "";
  }
}

function calculateRegistrationFee(age, course) {
  let fee = 5;
  if (age < 20) {
    fee *= 0.2;
  }
  if (course === "Money collection") {
    fee += 10;
  }
  return fee;
}

function displaySummary(name, gender, course, fee) {
  const greeting = generateGreeting(name, gender);
  const courseMessage = getCourseMessage(course);
  alert(`Student Name: ${name}\nGender: ${gender}\nGreeting: ${greeting}\nCourse: ${course}\nMessage: ${courseMessage}\nRegistration Fee: RM${fee}`);
}

const form = document.getElementById("registrationForm");
form.addEventListener("submit", (event) => {
  event.preventDefault();

  const name = document.getElementById("fullName").value;
  const icNumber = document.getElementById("icNumber").value;
  const age = parseInt(document.getElementById("age").value);
  const course = document.getElementById("course").value;
  const terms = document.getElementById("terms").checked;
  const genderField = document.getElementById("gender");
  const ageError = document.getElementById("ageError");
  ageError.textContent = "";

  if (age < 17) {
    ageError.textContent = "Age must be at least 17.";
    return;
  }

  const icValidation = validateIC(icNumber);
  if (!icValidation.isValid) {
    return;
  }

  genderField.value = icValidation.gender;

  if (!terms) {
    alert("Please agree to the terms and conditions.");
    return;
  }

  const fee = calculateRegistrationFee(age, course);
  displaySummary(name, icValidation.gender, course, fee);
});
</script>

</body>
</html>
